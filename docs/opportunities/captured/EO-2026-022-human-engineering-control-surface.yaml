id: EO-2026-022

title: Human Engineering Control Surface

status: captured

capability: Engineering

created: 2026-07-17

source: architecture-discovery-and-validation

summary: >
  Develop a human-facing engineering control surface that renders
  repository-, GitHub-, and Atlas-owned task state, approvals, evidence,
  platform relationships, blockers, and next actions without becoming a
  separate source of truth.

rationale: >
  GitHub preserves the canonical engineering record and Atlas provides
  deterministic repository understanding, but neither currently gives the
  owner one coherent visual operating interface for understanding active
  work, authority, completion state, dependencies, evidence, and required
  decisions. A generated control surface would increase human agency and
  reduce conversational handoff friction while preserving repository
  authority, explicit approval boundaries, and replaceable AI workspaces.

