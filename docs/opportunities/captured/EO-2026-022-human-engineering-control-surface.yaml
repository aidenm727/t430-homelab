evidence: |
  - The July 17 architecture discovery identified a missing human operating
    layer between repository and Atlas evidence and replaceable AI workspaces.
  - External design validation supported a Git-native operating model with
    durable task state, explicit approval gates, inspectable execution
    evidence, and a narrow generated human control surface.
  - Repository overlap review found that task context, contracts, autonomy,
    evidence, machine-readable interfaces, skills, evaluation, knowledge
    promotion, and orchestration already have existing Engineering
    Opportunity owners.
  - The overlap review found no existing opportunity whose central outcome is
    the human-facing product experience itself.
  - The owner accepted a minimal first experience consisting of Home, Task
    Detail, Approval Queue, Review and Evidence, and Platform Map.

notes: |
  The working product name is Aiden Platform Console. Product naming remains
  an open design question and should not block capability capture.

  The control surface should initially derive its state from GitHub, canonical
  repository objects, and Atlas evidence. It should not introduce an
  independently mutable application database or become another authority for
  engineering state.

  A minimal first experience may include:

  - Home.
  - Task Detail.
  - Approval Queue.
  - Review and Evidence.
  - Platform Map.

  The interface may expose links among task objects, GitHub issues, branches,
  pull requests, context packages, approval state, verification evidence,
  capabilities, systems, documentation, agents, and infrastructure.

  This opportunity is distinct from EO-2026-017. EO-2026-017 owns stable
  machine-readable Atlas and repository interfaces. EO-2026-022 owns the
  human-facing experience that consumes those interfaces.

  This opportunity is distinct from EO-2026-021. EO-2026-021 owns the
  Human-AI engineering collaboration loop and its lifecycle semantics.
  EO-2026-022 renders that loop for human understanding and decision.

  This opportunity is distinct from EO-2026-011. Documentation Intelligence
  improves knowledge capture, validation, synchronization, and understanding.
  EO-2026-022 provides the operational human interface across tasks,
  approvals, evidence, and platform relationships.

  Separate approval gates should remain visible for plan approval, privileged
  actions, merge, and deployment. Initial agent authority should stop at
  bounded preparation, verification, evidence production, and draft pull
  requests unless separately authorized.

  This captured object does not authorize architecture, implementation,
  lifecycle advancement, active-mission selection, automatic merge or
  deployment, EO-2026-013 Checkpoint B1b2 or B2, or creation of a general
  workflow engine.
