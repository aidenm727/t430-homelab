id: EO-2026-019

title: Instruction and context effectiveness evaluation

status: captured

capability: Engineering

created: 2026-07-13

source: brainstorming-session

summary: >
  Develop evidence-backed evaluation of whether task context,
  instructions, task contracts, and reusable engineering skills improve
  outcomes, preserve scope, reduce repair, and provide the information
  actually needed for reliable engineering work.

rationale: >
  Versioned instructions and deterministic context are only valuable if
  they reliably improve engineering behavior. The platform should be
  able to identify missing or irrelevant context, ambiguous rules,
  repeated human corrections, unnecessary repair loops, and skills that
  fail to produce expected artifacts without collapsing these signals
  into an opaque quality score.

