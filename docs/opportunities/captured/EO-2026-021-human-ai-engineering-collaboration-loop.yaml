id: EO-2026-021

title: Human-AI engineering collaboration loop

status: captured

capability: Engineering

created: 2026-07-13

source: brainstorming-session

summary: >
  Formalize the standard human-AI engineering loop as a composable Atlas
  workflow that moves from repository bootstrap and task definition
  through bounded execution, deterministic validation, evidence,
  review, synchronization, and human-authorized completion.

rationale: >
  The platform already follows many of these steps manually, but the
  complete collaboration loop is distributed across architecture,
  standards, Atlas commands, and conversational practice. Making the
  loop explicit would clarify responsibility, compose future context,
  contract, autonomy, skill, execution-record, and evaluation
  capabilities, and support partial autonomy without prematurely
  constructing a swarm of independent agents.

